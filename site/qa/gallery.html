<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>bingbong — visual QA</title><style>body{margin:24px;background:#080b13;color:#e1e6f0;font:15px/1.5 Arial,sans-serif}h1{font-size:28px}label{margin-right:20px}select{padding:8px;margin-left:8px;background:#111620;color:#e1e6f0}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px;margin-top:24px}figure{margin:0}img{width:100%;height:auto;border:1px solid #293142}a{color:#b7adff}figcaption{padding:8px 0}p{color:#919bad}</style><h1>bingbong · 240 resting-state captures</h1><p>Click a frame to inspect its original pixels. These are browser captures, not physical-phone evidence.</p><label>Width<select id="width"><option>390</option><option>820</option><option selected>1440</option><option>1920</option></select></label><label>Theme<select id="theme"><option>dark</option><option>light</option></select></label><label>Motion<select id="motion"><option value="no-preference">On</option><option value="reduce">Reduced</option></select></label><main></main><script>const ids=["hello","pet","boop","hold","creature","halo","object","quiet","size","details","inside","crown","detents","antenna","assembly"];function show(){const width=document.querySelector('#width').value,theme=document.querySelector('#theme').value,motion=document.querySelector('#motion').value;document.querySelector('main').innerHTML=ids.map((id,i)=>{const path='screens/'+width+'-'+theme+'-'+motion+'-'+id+'.png';return '<figure><a href="'+path+'"><img src="'+path+'" alt="'+id+' chapter at '+width+' pixels" loading="lazy"></a><figcaption>'+String(i+1).padStart(2,'0')+' / '+id+'</figcaption></figure>'}).join('')}document.querySelectorAll('select').forEach(el=>el.addEventListener('change',show));show()</script></html>
